<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gather Music Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- fundo animado -->
<canvas id="bg"></canvas>

<div class="player">

  <!-- vinil girando com a capa -->
  <div class="vinyl" id="vinyl">
    <img id="cover" class="cover" alt="">
    <div class="cover-fallback" id="coverFallback">🎧</div>
    <div class="vinyl-hole"></div>
  </div>

  <div class="meta">
    <div class="now">🎧 NOW PLAYING</div>
    <h1 id="title">Carregando…</h1>
    <h2 id="artist"></h2>
  </div>

  <!-- equalizador -->
  <div class="eq" id="eq">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- barra progresso -->
  <div class="progress"><div class="bar" id="bar"></div></div>

  <!-- controles -->
  <div class="controls">
    <button id="prevBtn" class="ctrl">⏮</button>
    <button id="toggleBtn" class="toggle">▶</button>
    <button id="nextBtn" class="ctrl">⏭</button>
  </div>

  <!-- volume — icone em SVG (nao emoji) pra herdar a cor da faixa -->
  <div class="volume">
    <button id="volIcon" type="button" aria-label="Mudo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="corpo" d="M3 9v6h4l5 4V5L7 9z"/>
        <path class="onda o1" d="M15.4 8.8a4.6 4.6 0 0 1 0 6.4"/>
        <path class="onda o2" d="M18.6 5.7a9 9 0 0 1 0 12.6"/>
        <path class="mudo" d="M16 9.5l5.5 5M21.5 9.5l-5.5 5"/>
      </svg>
    </button>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="1">
  </div>

</div>

<!-- só aparece quando o browser barra o autoplay com som: ja esta tocando
     mudo, e qualquer clique liga o audio -->
<div id="avisoMudo" class="aviso">🔇 clique para ligar o som</div>

<!-- iframe do YouTube: quem toca o som. Fica fora da tela, nunca some com
     display:none — escondido assim o browser pausa/derruba o player. -->
<div id="yt"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="script.js"></script>
</body>
</html>
